version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github

homebrew_casks:
  - name: missionctl
    description: Command-line client for Mission Control projects and time entries
    homepage: https://github.com/kmarsh/missionctl
    repository:
      owner: kmarsh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Kevin Marsh
      email: kevin.marsh@gmail.com
    # The binaries aren't signed or notarized, so clear the quarantine flag
    # Homebrew's download sets, or macOS refuses to run them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/missionctl"]
          end
