version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github

homebrew_casks:
  - name: missionctl
    description: Command-line client for Mission Control projects and time entries
    homepage: https://github.com/kmarsh/missionctl
    repository:
      owner: kmarsh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Kevin Marsh
      email: kevin.marsh@gmail.com
    # The binaries aren't signed or notarized, so clear the quarantine flag
    # Homebrew's download sets, or macOS refuses to run them. Written as
    # postflight_steps by hand because GoReleaser's hooks emit `postflight`,
    # which Homebrew 7 deprecates with a warning on every brew command. The
    # cask is itself a Go template, so {{staged_path}} is escaped to survive it.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/missionctl"]
        end
      end
